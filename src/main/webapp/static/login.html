<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>登录 · 味知源餐厅</title>
    <script>
        // 上下文路径自适应：Jetty(/) 与 Tomcat(/restaurant) 部署均可正常加载静态资源与接口
        (function () {
            var p = location.pathname;
            var i = p.indexOf('/static/');
            window.CTX = i >= 0 ? p.slice(0, i) : p.replace(/\/+$/, '');
            document.write('<base href="' + window.CTX + '/static/"/>');
        })();
    </script>
    <link rel="stylesheet" href="css/common.css"/>
</head>
<body>
<div id="toast"></div>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="center" style="margin-bottom:20px">
            <div style="font-size:38px">🍜</div>
            <h2 style="margin:6px 0 0">味知源餐厅</h2>
            <p class="muted" style="margin:0;font-size:13px">登录后可在线点餐、查看订单</p>
        </div>

        <div class="tabs">
            <button class="active" data-tab="pwd">账号密码登录</button>
            <button data-tab="phone">手机号登录</button>
        </div>

        <!-- 账号密码登录 -->
        <form class="form" id="form-pwd" novalidate>
            <div class="field">
                <label for="account">用户名 / 手机号</label>
                <input class="input" id="account" name="account" placeholder="请输入用户名或已绑定手机号" autocomplete="username"/>
                <div class="error-text" data-error="account"></div>
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input class="input" id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password"/>
                <div class="error-text" data-error="password"></div>
            </div>
            <label class="flex" style="gap:8px;font-size:13px">
                <input type="checkbox" id="rememberMe" name="rememberMe" style="width:16px;height:16px"/>
                记住我（30 天内免登录，基于 Cookie + 数据库令牌）
            </label>
            <button class="btn btn-block" type="submit">登 录</button>
            <div class="between" style="font-size:13px">
                <a href="register.html" style="color:var(--primary)">还没有账号？立即注册</a>
                <a href="index.html" class="muted">先去逛逛</a>
            </div>
            <div class="divider">演示账号</div>
            <div class="center muted" style="font-size:12.5px">
                管理员：admin / 123456 &nbsp;·&nbsp; 普通用户：tom / 123456
            </div>
        </form>

        <!-- 手机号验证码登录 -->
        <form class="form" id="form-phone" style="display:none" novalidate>
            <div class="field">
                <label for="phone">手机号</label>
                <input class="input" id="phone" name="phone" placeholder="11 位手机号" maxlength="11" autocomplete="tel"/>
                <div class="error-text" data-error="phone"></div>
            </div>
            <div class="field">
                <label for="code">验证码</label>
                <div class="flex" style="gap:8px">
                    <input class="input" id="code" name="code" placeholder="6 位验证码" maxlength="6"/>
                    <button class="btn btn-outline" type="button" id="btn-code" style="white-space:nowrap">获取验证码</button>
                </div>
                <div class="error-text" data-error="code"></div>
            </div>
            <label class="flex" style="gap:8px;font-size:13px">
                <input type="checkbox" id="rememberMePhone" name="rememberMe" style="width:16px;height:16px"/>
                记住我
            </label>
            <button class="btn btn-block" type="submit">登录 / 注册</button>
            <div class="center muted" style="font-size:12.5px">
                未注册的手机号将自动创建账号（演示环境验证码会直接回显并打印在控制台）
            </div>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
